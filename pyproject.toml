[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "medqa-deep-robustness"
version = "0.1.0"
description = "Minimal MedQA deep robustness evaluation runner"
authors = [
    { name = "DontTrustMedicalAIs" }
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "hydra-core>=1.3.2",
    "datasets>=2.20.0",
    "pandas>=2.0.0",
    "tqdm>=4.66.0",
    "litellm>=1.77.7",
    "PyYAML>=6.0.1",
    "plotly>=5.0.0",
]

[project.scripts]
medqa-deep = "medqa_deep_robustness.cli:main"

[project.optional-dependencies]
gpu = [
    "vllm>=0.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"medqa_deep_robustness" = ["data/*.yaml"]

name: Update Preview Image

on:
  push:
    branches: [main, master]
    paths:
      - "results/**"
      - "scripts/generate_svg_preview.py"
      - "scripts/generate_interactive_plot.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install plotly pyyaml

      - name: Generate visualizations
        run: |
          python scripts/generate_interactive_plot.py
          python scripts/generate_svg_preview.py

      - name: Commit updated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          git diff --staged --quiet || git commit -m "Update interactive visualization and preview image"
          git push
